services:
  api:
    build: ./api
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ALLOWED_ORIGINS: "https://documentscanner.nexpa.co"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - api_data:/app/data
    restart: unless-stopped

  app:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_API_URL: "https://api.documentscanner.nexpa.co"
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
